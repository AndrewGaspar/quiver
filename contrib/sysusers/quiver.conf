# quiver-sysusers v1 (design/INSTALL.md): Quiver's system groups.
#
# Nobody is a member of any of them, and no host process runs with one. Each gid sits in the
# subordinate gid range that rootless podman and newgidmap map (/etc/subgid, e.g.
# you:100000:65536), so only a lab container or a stream's own user namespace is ever given one,
# and only the one it needs. udev wants group names it can resolve (a bare number is ignored),
# hence this file.
#
#   quiver-lab-pad     lab instances' virtual pads (contrib/lab/72-quiver-lab-pad.rules);
#                      gid 5001 in a lab container (--userns=keep-id)
#   quiver-stream-pad  streams' virtual pads (contrib/stream/72-quiver-stream-pad.rules)
#   quiver-uinput      /dev/uinput for a stream host on a machine where nobody is seated
#                      (contrib/udev/72-quiver-uinput.rules)
#
# A system package installs it to /usr/lib/sysusers.d/quiver.conf (pacman's hook runs
# systemd-sysusers); `quiver system setup` installs it to /etc/sysusers.d/quiver.conf.
g quiver-lab-pad 105000
g quiver-stream-pad 105001
g quiver-uinput 105002
