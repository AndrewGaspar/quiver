<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<!-- Quiver's mark ("Parallax"): a Q whose tail is an arrow leaving the ring, drawn as a left/right pair. The overlap is drawn explicitly (a mask), so no blend mode is needed. -->
<defs><mask id="ov" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120"><g transform="translate(-3.5 0) rotate(90 50 52)"><circle cx="50" cy="52" r="30" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="150 38.5"/><line x1="44" y1="58" x2="72" y2="30" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M88 14 L64 19 L83 38 Z" fill="#fff"/></g></mask></defs><g transform="translate(-3.5 0) rotate(90 50 52)"><circle cx="50" cy="52" r="30" fill="none" stroke="#1FA9CB" stroke-width="10" stroke-dasharray="150 38.5"/><line x1="44" y1="58" x2="72" y2="30" stroke="#1FA9CB" stroke-width="10" stroke-linecap="round"/><path d="M88 14 L64 19 L83 38 Z" fill="#1FA9CB"/></g><g transform="translate(3.5 0) rotate(90 50 52)"><circle cx="50" cy="52" r="30" fill="none" stroke="#F0503C" stroke-width="10" stroke-dasharray="150 38.5"/><line x1="44" y1="58" x2="72" y2="30" stroke="#F0503C" stroke-width="10" stroke-linecap="round"/><path d="M88 14 L64 19 L83 38 Z" fill="#F0503C"/></g><g mask="url(#ov)"><g transform="translate(3.5 0) rotate(90 50 52)"><circle cx="50" cy="52" r="30" fill="none" stroke="#1C2226" stroke-width="10" stroke-dasharray="150 38.5"/><line x1="44" y1="58" x2="72" y2="30" stroke="#1C2226" stroke-width="10" stroke-linecap="round"/><path d="M88 14 L64 19 L83 38 Z" fill="#1C2226"/></g></g>
</svg>
