[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ubi-proto = { path = "crates/ubi-proto" }
ubi-core = { path = "crates/ubi-core" }
ubi-ipc = { path = "crates/ubi-ipc" }
ubi-api = { path = "crates/ubi-api" }
anyhow = "1"
thiserror = "2"
prost = "0.14"
prost-build = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1"
base64 = "0.22"
md5 = "0.7"
zstd = "0.13"
sha1 = "0.10"
hex = "0.4"
futures = "0.3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
libc = "0.2"
tempfile = "3"

[patch.crates-io]
# gpui -> zed-async-tar -> xattr 0.2.3, which references libc::ENOATTR (removed on Linux).
xattr = { path = "third_party/xattr-0.2.3" }
