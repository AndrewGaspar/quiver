[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored, patched crates (see [patch] below) are dependencies, not members.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
quiver-proto = { path = "crates/quiver-proto" }
quiver-core = { path = "crates/quiver-core" }
quiver-ipc = { path = "crates/quiver-ipc" }
quiver-api = { path = "crates/quiver-api" }
quiver-perf = { path = "crates/quiver-perf" }
epic-core = { path = "crates/epic-core" }
anyhow = "1"
thiserror = "2"
prost = "0.14"
prost-build = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1"
base64 = "0.22"
md5 = "0.7"
zstd = "0.13"
sha1 = "0.10"
hex = "0.4"
futures = "0.3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }
libc = "0.2"
tempfile = "3"
toml = "1"
# GPUI from Zed's repository, pinned: the newest revision that builds with Rust 1.96 and has
# layer-shell windows and the wgpu headless renderer (crates/quiver-ui/src/lib.rs).
gpui = { git = "https://github.com/zed-industries/zed", rev = "482e76524bd33d8cbdfc352f1fef3eefbf2fad92" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "482e76524bd33d8cbdfc352f1fef3eefbf2fad92", features = ["wayland", "x11"] }

# GPUI crates Quiver patches (off-screen windows rendered by the wgpu headless renderer):
# pristine copies of the pinned revision in third_party/zed, Quiver's commits on top.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "third_party/zed/gpui" }
gpui_linux = { path = "third_party/zed/gpui_linux" }
gpui_wgpu = { path = "third_party/zed/gpui_wgpu" }
