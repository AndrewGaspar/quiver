[package]
name = "quiver-sight"
description = "Sight: Quiver's in-game overlay process (HUD renderer, desktop HUD, toast lane)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quiver-sight"
path = "src/main.rs"

# GPUI on the main thread: its own main, not libtest's.
[[test]]
name = "fixed_card"
harness = false

[[test]]
name = "ingame_panel"
harness = false

[[test]]
name = "panel_view"
harness = false

[dependencies]
quiver-api.workspace = true
quiver-perf.workspace = true
quiver-ui = { path = "../quiver-ui" }
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
chrono.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Wayland outputs are identified by a v5 UUID of their name (gpui_linux's WaylandDisplay).
uuid = { version = "1", features = ["v5"] }
# The compositor's toplevels (wlr-foreign-toplevel-management), on a connection of our own,
# to tie the panel and the desktop HUD to the game's window (design/SIGHT.md §14). The same
# versions gpui_linux already uses.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
image.workspace = true
# The layer's graph code, so `hud_variants` draws the live graph into its PNGs as the layer
# would (pure CPU code: History and the vertex builder).
quiver-sight-layer = { path = "../quiver-sight-layer" }
