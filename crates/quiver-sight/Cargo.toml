[package]
name = "quiver-sight"
description = "Sight: Quiver's in-game overlay process (HUD renderer, desktop HUD, toast lane)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quiver-sight"
path = "src/main.rs"

# GPUI on the main thread: its own main, not libtest's.
[[test]]
name = "fixed_card"
harness = false

[dependencies]
quiver-api.workspace = true
quiver-perf.workspace = true
quiver-ui = { path = "../quiver-ui" }
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Wayland outputs are identified by a v5 UUID of their name (gpui_linux's WaylandDisplay).
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
