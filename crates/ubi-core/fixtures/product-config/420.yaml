    RELATED_DESCRIPTION_1216: "W nowych misjach w trybie pojedynczego gracza i kooperacji nigdy nie będziesz sam, gdyż yeti czychają w mroku..."
    RELATED_DESCRIPTION_1585: "Zawiera ekskluzywną misję dla pojedynczego gracza dostępną jedynie w przepustce sezonowej."
