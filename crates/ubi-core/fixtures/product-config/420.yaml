    RELATED_DESCRIPTION_1214: Het Hurk Deluxe Pack bevat 5 missies en 5 wapens.
    RELATED_DESCRIPTION_1215: Kies partij voor de Rakshasa of het Gouden Pad en verover neutrale locaties in het landschap van Kyrat.
    RELATED_DESCRIPTION_1216: "In deze nieuwe missie, speelbaar zowel als singleplayer en coöp ben je nooit alleen wanneer de yetis"
