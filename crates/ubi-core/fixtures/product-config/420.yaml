  da-DK:
    DESCRIPTION: "En eksklusiv singleplayer-mission, der kun er tilgængelig med season pass."
    RELATED_DESCRIPTION_1213: "I skal flygte fra fængslet og overleve i Pagan Mins fjendtligt stemte Kyrat."
    RELATED_DESCRIPTION_1214: "Hurk Deluxe-pakken indeholder Fem missioner, Fem våben"
    RELATED_DESCRIPTION_1215: "Spil sammen som enten Rakshasa’en eller Den gyldne sti, og indtag en række neutrale positioner i Kyrat, hvorefter I skal beskytte området mod angribende fjender."
    RELATED_DESCRIPTION_1216: "I disse nye missioner til både singleplayer og samarbejde er du aldrig alene, for yetierne vil have deres bytte ..."
    RELATED_DESCRIPTION_1585: "En eksklusiv singleplayer-mission, der kun er tilgængelig med season pass."
  de-DE:
    DESCRIPTION: "Setze dein Far Cry®4-Abenteuer mit dem Far Cry®4 Season-Pass fort."
    RELATED_DESCRIPTION_1213: "Brich aus dem Gefängnis aus und überlebe auf dem feindlichen Terrain von Pagan Mins Kyrat."
    RELATED_DESCRIPTION_1214: "Das Hurk Deluxe Pack enthält 5 Missionen und 5 Waffen."
    RELATED_DESCRIPTION_1215: "Schließe dich den Rakshasa oder dem Goldenen Pfad an und übernimm die Herrschaft über eine Reihe neutraler Gebiete in Kyrat."
    RELATED_DESCRIPTION_1216: In diesen neuen Missionen mit Singleplayer- sowie Koop-Action wirst du nie allein sein, denn die Yetis lauern auf ihre Beute...
    RELATED_DESCRIPTION_1585: "Setze dein Far Cry®4-Abenteuer mit dem Far Cry®4 Season-Pass fort."
  es-ES:
    DESCRIPTION: "Incluye una misión del modo individual solo disponible con el pase de temporada."
    RELATED_DESCRIPTION_1213: "Escapa de la cárcel y sobrevive al hostil territorio del Kyrat de Pagan Min."
    RELATED_DESCRIPTION_1214: El Pack Deluxe de Hurk contiene 5 misiones y 5 armas
    RELATED_DESCRIPTION_1215: "Únete a los Rakshasa o a la Senda Dorada y controla una serie de ubicaciones neutrales repartidas por las zonas rurales de Kyrat."
    RELATED_DESCRIPTION_1216: "En estas nuevas misiones de acción Individual y Cooperativo, nunca estarás solo pues te esperarán los Yetis..."
    RELATED_DESCRIPTION_1585: "Incluye una misión del modo individual solo disponible con el pase de temporada."
  fi-FI:
    DESCRIPTION: "Sisältö rajoitettu yksinpelitehtävä, saatavissa vain season passilla."
    RELATED_DESCRIPTION_1213: "Pakene vankilasta ja selviydy Pakana Minin Kyratin vihamielisillä mailla."
    RELATED_DESCRIPTION_1214: "Hurk Deluxe Pack sisältää 5 tehtävää, 5 asetta."
    RELATED_DESCRIPTION_1215: "Muodosta Rakshasa- tai Kultaisen polun joukkue ja hallitse neutraalien kohteiden sarjaa Kyratin maaseudulla suojellaksesi niitä vastustajiesi valloitusyrityksiltä."
    RELATED_DESCRIPTION_1216: "Et ole näissä yksin- ja yhteistyöpelin sisältävissä uusissa tehtävissä koskaan yksin, sillä jetit vaanivat saalistaan..."
    RELATED_DESCRIPTION_1585: "Sisältö rajoitettu yksinpelitehtävä, saatavissa vain season passilla."
  fr-FR:
    DESCRIPTION: 4 nouvelles missions et une mission solo exclusive disponible uniquement avec le season pass
    RELATED_DESCRIPTION_1213: "Évadez-vous et tâchez de survivre sur les terres hostiles du Kyrat de Pagan Min."
    RELATED_DESCRIPTION_1214: Le pack Hurk Deluxe contient 5 missions et 5 armes.
    RELATED_DESCRIPTION_1215: "Battez-vous aux côtés des Rakshasas ou du Sentier d'Or et protégez des zones neutres du Kyrat pour empêcher vos adversaires de les envahir."
    RELATED_DESCRIPTION_1216: "Dans ces missions également jouables en coop, soyez vigilant car les yétis attendent leur proie dans l'ombre..."
    RELATED_DESCRIPTION_1585: 4 nouvelles missions et une mission solo exclusive disponible uniquement avec le season pass
  it-IT:
    DESCRIPTION: Include 4 missiones y una missione esclusiva per singolo giocatore disponibile solo con il season pass.
    RELATED_DESCRIPTION_1213: Fuggi dalla prigione e sopravvivi nelle terre ostili del Kyrat di Pagan Min.
    RELATED_DESCRIPTION_1214: Il pacchetto Hurk Deluxe contiene 5 missioni e 5 armi.
    RELATED_DESCRIPTION_1215: Schierati con i Rakshasa o con il Sentiero d'oro e lotta per il controllo di varie posizioni neutrali in giro per il Kyrat.
    RELATED_DESCRIPTION_1216: "In queste nuove missioni d'azione singola o cooperativa, non sarai mai solo, perchè gli Yeti trovano sempre le loro prede..."
    RELATED_DESCRIPTION_1585: Include 4 missiones y una missione esclusiva per singolo giocatore disponibile solo con il season pass.
  nb-NO:
    DESCRIPTION: Inneholder et eksklusivt enkeltspilleroppdrag som bare er tilgjengelig med season pass.
    RELATED_DESCRIPTION_1213: "Røm fra fengselet, og overlev i det ugjestmilde landskapet i Pagan Mins Kyrat."
    RELATED_DESCRIPTION_1214: "Hurk Deluxe-pakke inneholder 5 oppdrag, 5 våpen."
    RELATED_DESCRIPTION_1215: "Spill på lag som Rakshasa eller Den gylne sti, og få kontroll over en rekke nøytrale posisjoner på den kyratiske landsbygda for å beskytte dem mot å bli erobret av motstanderne."
    RELATED_DESCRIPTION_1216: " I disse nye oppdragene med solo- og samarbeidsaction er du aldri alene mens yetiene venter på byttet sitt …"
    RELATED_DESCRIPTION_1585: Inneholder et eksklusivt enkeltspilleroppdrag som bare er tilgjengelig med season pass.
  nl-NL:
    DESCRIPTION: Inclusief 4 missie, een exclusieve singleplayer-missie, alleen verkrijgbaar met de season pass.
