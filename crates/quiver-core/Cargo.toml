[package]
name = "quiver-core"
description = "Native Ubisoft Connect client core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quiver-proto.workspace = true
quiver-perf.workspace = true
anyhow.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
flate2.workspace = true
base64.workspace = true
keyring.workspace = true
tracing.workspace = true
chrono.workspace = true
quiver-ipc.workspace = true
md5.workspace = true
zstd.workspace = true
sha1.workspace = true
hex.workspace = true
futures.workspace = true
quiver-api.workspace = true
crc32fast.workspace = true
image.workspace = true
libc.workspace = true
toml.workspace = true
sha2 = "0.10"
regex = "1"
# The lab's EOS proxy (lab::eosproxy): HTTP/1.1 on both sides, and its per-instance CA.
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
# The lab's fixed-step virtual clock (lab::vclock): the hook DLL it drops into an instance.
quiver-vclock = { path = "../quiver-vclock" }

[dev-dependencies]
tempfile.workspace = true
