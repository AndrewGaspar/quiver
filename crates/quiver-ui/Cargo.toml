[package]
name = "quiver-ui"
description = "Quiver's GPUI design system: theme tokens, fonts, icons and shared components"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
quiver-api.workspace = true
quiver-perf.workspace = true
serde_json.workspace = true
gilrs = "0.11"
