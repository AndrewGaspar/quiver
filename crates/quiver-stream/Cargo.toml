[package]
name = "quiver-stream"
description = "Quiver's remote-play client: the stream window (SDL3 input, libav decode, Vulkan present, Opus audio), design/REMOTE.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quiver-stream"
path = "src/main.rs"

[dependencies]
quiver-stream-proto.workspace = true
quiver-stream-net.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ash = { version = "0.38", features = ["loaded"] }
sdl3-sys = { version = "0.7", features = ["use-ash-v0-38"] }
crossbeam-channel = "0.5"
# The overlay's glyphs and logo, rasterised once into an atlas at start.
resvg = { version = "0.46", default-features = false }
ttf-parser = "0.25"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
