[package]
name = "quiverd"
description = "Background daemon: owns the Ubisoft session, games, settings and jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quiverd"
path = "src/main.rs"

[dependencies]
quiver-core.workspace = true
quiver-api.workspace = true
quiver-remote.workspace = true
# Moonlight compatibility (`moonlight.rs`): the GameStream server, streaming from the host.
quiver-gamestream = { path = "../quiver-gamestream", features = ["stream-host"] }
quiver-stream-host = { path = "../quiver-stream-host" }
epic-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
libc.workspace = true
serde_yaml.workspace = true
quiver-perf.workspace = true
toml.workspace = true
base64.workspace = true
quiver-proto.workspace = true
# The Sight panel: achievement icons (`sightinfo.rs`), cached under a hash of their URL.
reqwest.workspace = true
sha1.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
prost.workspace = true
flate2.workspace = true
# tests/moonlight.rs: Moonlight's side of pairing.
ring = "0.17"
sha2 = "0.10"
