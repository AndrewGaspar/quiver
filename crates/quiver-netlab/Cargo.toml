[package]
name = "quiver-netlab"
description = "Network-conditions lab for remote play: rootless namespaces shaped by kernel netem/tbf/cake, profiles, scenarios, probes and reports (design/REMOTE.md §8.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "quiver-netlab"
path = "src/main.rs"

[dependencies]
quiver-stream-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
libc.workspace = true
socket2 = { version = "0.6", features = ["all"] }
fastrand = "2"

[dev-dependencies]
tempfile.workspace = true
