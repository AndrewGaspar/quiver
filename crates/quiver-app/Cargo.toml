[package]
name = "quiver-app"
description = "Quiver's desktop app: a GPUI front end for the quiverd daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quiver-app"
path = "src/main.rs"

[dependencies]
quiver-api.workspace = true
quiver-remote.workspace = true
quiver-stream-proto.workspace = true
quiver-perf.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
toml.workspace = true
futures.workspace = true
reqwest.workspace = true
sha1.workspace = true
hex.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
quiver-ui = { path = "../quiver-ui" }
# Same major as gpui's, so the decoders are shared.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify = { version = "8", default-features = false }
gilrs = "0.11"

[dev-dependencies]
tempfile = "3"
