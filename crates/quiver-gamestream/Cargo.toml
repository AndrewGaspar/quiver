[package]
name = "quiver-gamestream"
description = "A GameStream-protocol server (what Moonlight speaks) over Quiver's remote-play host types (design/REMOTE.md, phase 1b)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quiver-gamestream-test"
path = "src/bin/test_server.rs"

[features]
# StreamHostAdapter: serve Moonlight from quiver-stream-host (NVENC, gamescope, PipeWire).
stream-host = ["dep:quiver-stream-host"]

[dependencies]
quiver-stream-proto.workspace = true
quiver-stream-host = { path = "../quiver-stream-host", optional = true }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
image.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-rustls.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# RSA key generation only (ring signs and verifies, but can't generate RSA keys). Moonlight's
# clients verify the server's pairing signature as SHA256withRSA, so the key must be RSA.
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand = "0.8"
ring = "0.17"
x509-parser = "0.16"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
sha2 = "0.10"
rusty_enet = "0.4"
crc32fast.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
